<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="banner-mobile-title banner-mobile-desc">
  <title id="banner-mobile-title">Riyad Sarkar - Cybersecurity Expert and AI Expert</title>
  <desc id="banner-mobile-desc">Compact animated banner with a glowing shield, orbit rings and a cybersecurity and AI tagline.</desc>

  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.6" stop-color="#07101F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="m-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="m-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="m-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E293B" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="m-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#164E63" stroke-width="1" opacity="0.28"/>
    </pattern>
    <filter id="m-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="m-card"><rect width="720" height="560" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#m-card)">
    <rect width="720" height="560" fill="url(#m-bg)"/>
    <rect x="-40" y="-40" width="800" height="640" fill="url(#m-grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="16s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="360" cy="176" rx="300" ry="220" fill="url(#m-halo)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#475569">
      <circle cx="34" cy="30" r="3.4" fill="#22D3EE"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="46" y="34" fill="#67E8F9">SYSTEM ONLINE</text>
      <text x="686" y="34" text-anchor="end">SECURITY / AI</text>
    </g>

    <g transform="translate(360 188)">
      <circle r="126" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="2 11" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      </circle>
      <circle r="102" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="30 80" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -78 L54 -55 V-3 C54 39 31 69 0 84 C-31 69 -54 39 -54 -3 V-55 Z" fill="url(#m-shield)" stroke="#22D3EE" stroke-width="1.4" filter="url(#m-glow)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <g filter="url(#m-glow)">
        <rect x="-18" y="-6" width="36" height="30" rx="5" fill="#0B1626" stroke="#22D3EE" stroke-width="1.3"/>
        <path d="M-10 -6 V-14 A10 10 0 0 1 10 -14 V-6" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="0" cy="6" r="3.2" fill="#67E8F9"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
        <rect x="-1.1" y="8.5" width="2.2" height="7" rx="1.1" fill="#67E8F9"/>
      </g>
      <circle cx="0" cy="-102" r="2.8" fill="#67E8F9" filter="url(#m-glow)"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="89" cy="51" r="2.4" fill="#38BDF8" filter="url(#m-glow)"><animate attributeName="opacity" values="1;0.2;1" dur="4.1s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="-89" cy="51" r="2.4" fill="#22D3EE" filter="url(#m-glow)"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <text x="360" y="338" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.6" fill="#22D3EE">// CYBERSECURITY &#215; ARTIFICIAL INTELLIGENCE</text>
    <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="1.4" fill="url(#m-name)">RIYAD SARKAR</text>
    <rect x="300" y="407" width="120" height="2.6" rx="1.3" fill="url(#m-accent)">
      <animate attributeName="width" values="0;120;120" dur="2.2s" keyTimes="0;0.7;1" fill="freeze"/>
    </rect>
    <text x="360" y="440" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#CBD5E1">Cybersecurity Expert &#38; AI Expert</text>
    <text x="360" y="466" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Security research, applied AI and automation.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2">
      <rect x="170" y="490" width="132" height="28" rx="5" fill="#0B1626" stroke="#155E75"/>
      <text x="236" y="508" text-anchor="middle" fill="#67E8F9">SECURITY RESEARCH</text>
      <rect x="310" y="490" width="110" height="28" rx="5" fill="#0B1626" stroke="#155E75"/>
      <text x="365" y="508" text-anchor="middle" fill="#67E8F9">AI SYSTEMS</text>
      <rect x="428" y="490" width="122" height="28" rx="5" fill="#0B1626" stroke="#155E75"/>
      <text x="489" y="508" text-anchor="middle" fill="#67E8F9">AUTOMATION</text>
    </g>

    <text x="360" y="542" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.6" fill="#475569">github.com/riyadsarkar07</text>

    <g stroke="#22D3EE" stroke-width="1.8" fill="none" opacity="0.5">
      <path d="M18 18 H40 M18 18 V40"/>
      <path d="M702 18 H680 M702 18 V40"/>
      <path d="M18 542 H40 M18 542 V520"/>
      <path d="M702 542 H680 M702 542 V520"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="718.5" height="558.5" rx="18" fill="none" stroke="#164E63" stroke-width="1.4"/>
</svg>
