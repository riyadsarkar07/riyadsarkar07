<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Decorative cyan divider">
  <defs>
    <linearGradient id="divider-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="divider-glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#divider-line)" stroke-width="1.5"/>
  <circle cy="12" r="2.6" fill="#67E8F9" filter="url(#divider-glow)">
    <animate attributeName="cx" values="120;1080;120" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
